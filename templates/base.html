<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5">
  <meta name="theme-color" content="#101b1c">
  <meta name="description" content="{% block description %}Прогноз спроса на авиабилеты и динамическое ценообразование.{% endblock %}">
  <title>{% block title %}Решись Авиа{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <div class="app-shell">
    {% include "partials/header.html" %}
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% include "partials/auth_dialog.html" %}
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
